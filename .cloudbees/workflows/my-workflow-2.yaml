apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      key1:
        type: string
        default: does it matter
        description: sample input
      key2:
        type: string
        default: mydefault
        description: "yet another "
      TestTag:
        type: choice
        options:
          - "@Login"
          - "@MarketplaceTest"
          - "@SecurityCenterTest"
          - "@SlaConfig"
          - "@SummaryWidget"
          - "@AllScanners"
          - "@WorkflowTest"
          - "@ActionTest"
          - "@EnvironmentTest"
          - "@PropertyTest"
          - "@NotificationTest"
          - "@FM"
          - "@IntegrationTest"
          - "@OrganizationTest"
          - "@TestInsights"
          - "@JenkinsManagementTest"
          - "@UserManagementTest"
          - "@Bitbucket"
          - "@Cleanup"
          - '@UserInviteTest'
          - "@VSMDashboard"
          - "@CoreRegression"
        default: "@Login"
        required: true
        description: Choose test tags to run tests related to that feature
      Browser:
        type: choice
        options:
          - chrome
          - firefox
          - safari
        default: chrome
        required: true
        description: Choose which browser you want to run the tests
      Environment:
        type: choice
        options:
          - PROD
          - QA
          - PREPROD
        default: PREPROD
        required: true
        description: Choose environment where test will run
jobs:
  build:
    steps:
      - name: Say hello
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "hello world"
          echo "key1: ${{ inputs.key1 }}"
          echo "key2: ${{ inputs.key2 }}"

